name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra dev ruff check aioacaia tests run.py
          uv run --locked --extra dev ruff format --check aioacaia tests run.py

      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev mypy aioacaia tests run.py test.py

      - name: Test
        run: uv run --locked --extra dev pytest -q